[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medextract-lab-bench"
version = "0.3.0"
description = "Offline benchmark for forecasting measured hemoglobin and HbA1c from longitudinal laboratory results"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MedExtract" }]
keywords = [
    "hemoglobin", "HbA1c", "laboratory results", "time series forecasting",
    "clinical informatics", "prediction intervals", "reproducible research",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.26,<3", "openpyxl>=3.1,<4"]

[project.urls]
Repository = "https://github.com/AdrianPerez3/medextract-lab-bench"

[project.optional-dependencies]
boston = ["duckdb==1.5.5"]
test = ["pytest>=8,<10", "jsonschema>=4.18,<5", "setuptools>=77"]

[project.scripts]
lab-bench = "medextract_lab_bench.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.cmdclass]
sdist = "medextract_build.SourceDistribution"

[tool.setuptools.package-data]
medextract_lab_bench = ["protocols/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
