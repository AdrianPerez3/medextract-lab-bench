name: Offline benchmark checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements/runtime.lock
      - run: python -m pip install ".[test,boston]" build
      - run: python -m pytest -q
      - run: python -m build
      - run: python tools/check_dist.py dist/*
      - run: |
          python -m venv /tmp/bench-check
          /tmp/bench-check/bin/pip install --require-hashes -r requirements/runtime.lock
          /tmp/bench-check/bin/pip install --no-deps dist/*.whl
          wheel=$(realpath dist/*.whl)
          cd /tmp
          /tmp/bench-check/bin/lab-bench run --task synthetic-demo --out numeric-demo.json
          /tmp/bench-check/bin/lab-bench run --task synthetic-events --out event-demo.json
          /tmp/bench-check/bin/pip install "${wheel}[boston]"
          /tmp/bench-check/bin/lab-bench run --task synthetic-boston --out boston-demo.json
